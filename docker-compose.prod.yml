# Production stack: gunicorn API, Celery worker + beat (scheduled backups), Redis, and
# nginx serving the built Vue app, Django static files, and proxying /api and /admin.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The SQLite database and its backups live in the `sqlite_data` volume; back that volume up.

x-backend: &backend
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: sqlite:////app/data/db.sqlite3
    BACKUP_DIR: /app/data/backups
    REDIS_URL: redis://redis:6379/0
  volumes:
    - sqlite_data:/app/data
  depends_on:
    - redis
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes:
      - sqlite_data:/app/data
      - static_files:/app/staticfiles
    expose:
      - "8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 1

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /app/data/celerybeat-schedule

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_files:/usr/share/nginx/static:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite_data:
  static_files:
