# Development stack: Django (runserver), Celery worker + beat, Redis and the Vite dev server.
# The SQLite database lives in the `sqlite_data` volume, shared by api, worker and beat.

x-backend: &backend
  build:
    context: .
    args:
      REQUIREMENTS: development
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_URL: sqlite:////app/data/db.sqlite3
    BACKUP_DIR: /app/data/backups
    REDIS_URL: redis://redis:6379/0
  volumes:
    - .:/app
    - sqlite_data:/app/data
  depends_on:
    - redis

services:
  api:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /app/data/celerybeat-schedule

  redis:
    image: redis:7-alpine

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      DEV_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  sqlite_data:
  frontend_node_modules:
