exclude: ^(legacy_laravel|xPrinter)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: .venv/bin/bandit -q -c pyproject.toml -r .
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npx oxlint . && npx eslint . && npx vue-tsc --build'
        language: system
        files: ^frontend/
        pass_filenames: false
